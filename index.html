        function renderGrid(data) {
            const grid = document.getElementById('archiveGrid');
            document.getElementById('total-count').innerText = `${data.length} Projects`;
            grid.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden hover:border-zinc-700 transition flex flex-col justify-between";
                
                // Fallbacks for missing data
                const agency = item.agency ? item.agency : "Unknown";
                const production = item.production ? item.production : "Unknown";
                const award = item.award ? item.award : "Archive Entry";
                const description = item.description ? item.description : "No description available for this entry.";
                
                card.innerHTML = `
                    <div>
                        <div class="relative h-44 w-full bg-zinc-950 overflow-hidden">
                            <img src="${item.bannerUrl}" alt="${item.title}" class="w-full h-full object-cover opacity-85 hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/640x360.png?text=No+Thumbnail'">
                            <span class="absolute top-3 left-3 bg-red-950/90 text-red-400 border border-red-800/60 text-xs px-2.5 py-0.5 rounded font-mono font-medium">${item.year}</span>
                            <span class="absolute top-3 right-3 bg-zinc-950/80 text-zinc-300 text-xs px-2 py-0.5 rounded backdrop-blur">${item.format}</span>
                        </div>

                        <div class="p-5">
                            <h2 class="text-base font-semibold text-white mb-1 line-clamp-2">${item.title}</h2>
                            <p class="text-xs text-zinc-500 mb-3">${item.titleJp || ''}</p>
                            
                            <p class="text-xs text-zinc-300 mb-4 line-clamp-3 leading-relaxed">${description}</p>

                            <div class="space-y-1 text-xs text-zinc-400 border-t border-zinc-800/80 pt-3">
                                <div><span class="text-zinc-500">Award:</span> ${award}</div>
                                <div><span class="text-zinc-500">Agency:</span> ${agency}</div>
                                <div><span class="text-zinc-500">Production:</span> ${production}</div>
                            </div>
                        </div>
                    </div>

                    <div class="p-5 pt-0 mt-auto">
                        <a href="${item.videoUrl}" target="_blank" class="w-full bg-zinc-800 hover:bg-red-600 text-white text-xs font-medium py-2.5 rounded-lg flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-play"></i> Watch Video
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderGrid(archiveData);

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const year = document.getElementById('yearFilter').value;
            const format = document.getElementById('formatFilter').value;

            const filtered = archiveData.filter(item => {
                const searchStr = `${item.title} ${item.agency || ''} ${item.description || ''} ${item.production || ''}`.toLowerCase();
                const matchesSearch = searchStr.includes(search);
                const matchesYear = year === 'ALL' || item.year === year || (!item.year && year === 'Unknown');
                const matchesFormat = format === 'ALL' || (item.format && item.format.includes(format));
                
                return matchesSearch && matchesYear && matchesFormat;
            });

            renderGrid(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('yearFilter').addEventListener('change', filterData);
        document.getElementById('formatFilter').addEventListener('change', filterData);
